<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI — Web Remote Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07090f;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00d4ff;
      --text: #dde3ed;
      --muted: #5e6a7e;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 6px;
      margin-bottom: 8px;
    }
    .logo em { color: var(--accent); font-style: normal; }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
      letter-spacing: 1px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text {
      font-size: 14px;
      color: var(--muted);
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="subtitle">AI ASSISTANT — REMOTE DASHBOARD</div>
    <div class="spinner"></div>
    <div class="status-text" id="status">Initialising Web Session…</div>
  </div>

  <script>
    (async function () {
      const token = sessionStorage.getItem('jarvis_token');
      const statusEl = document.getElementById('status');

      if (token) {
        statusEl.textContent = 'Redirecting to Dashboard…';
        window.location.replace('/app.html');
        return;
      }

      statusEl.textContent = 'Auto-authenticating Session…';
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: "AUTO" })
        });
        const data = await r.json();
        if (data.ok && data.token) {
          sessionStorage.setItem('jarvis_key', data.key || 'JARVIS-AUTO');
          sessionStorage.setItem('jarvis_token', data.token);
          statusEl.textContent = 'Connected — Launching App…';
          window.location.replace('/app.html');
          return;
        }
      } catch (e) {
        console.error('Auto-login error:', e);
      }
      window.location.replace('/login.html');
    })();
  </script>
</body>
</html>
